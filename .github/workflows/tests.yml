name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        install-target: [".", ".[formats]", ".[imaging]", ".[formats,imaging]"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: >-
          python -m pip install "${{ matrix.install-target }}"
          --constraint .github/constraints/calibration-readers.txt
      - name: Run tests
        run: python -m unittest -v
      - name: Check installed command
        run: |
          neurodata-security-audit --version
          neurodata-security-audit scan tests/fixtures/clean_bids

  clean-install:
    name: clean install (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package with all optional readers
        run: >-
          python -m pip install ".[formats,imaging]"
          --constraint .github/constraints/calibration-readers.txt
      - name: Check the installed package outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          REPOSITORY_ROOT: ${{ github.workspace }}
        run: |
          python -c "import os; from pathlib import Path; import neurodata_security_audit, mne, nibabel, pydicom; path = Path(neurodata_security_audit.__file__).resolve(); print(path); assert Path(os.environ['REPOSITORY_ROOT']).resolve() not in path.parents; assert mne.__version__ == '1.12.1'; assert nibabel.__version__ == '5.4.2'; assert pydicom.__version__ == '3.0.2'"
          neurodata-security-audit --version
          neurodata-security-audit scan "${{ github.workspace }}/tests/fixtures/clean_bids"

  exact-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the exact wheel
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[formats,imaging]" \
            --constraint .github/constraints/calibration-readers.txt
      - name: Run copied tests outside the checkout
        run: |
          isolated="${RUNNER_TEMP}/exact-wheel"
          mkdir -p "${isolated}/examples" "${isolated}/tests"
          cp tests/__init__.py \
            tests/test_benchmark.py \
            tests/test_curator.py \
            tests/test_external_benchmark.py \
            tests/test_scanner.py \
            "${isolated}/tests/"
          cp -R benchmark "${isolated}/benchmark"
          cp -R examples/reviewer_demo "${isolated}/examples/reviewer_demo"
          cd "${isolated}"
          python - <<'PY'
          from pathlib import Path
          import neurodata_security_audit

          path = Path(neurodata_security_audit.__file__).resolve()
          print(path)
          assert "site-packages" in path.parts
          PY
          python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build checks
        run: python -m pip install build jsonschema
      - name: Build the wheel twice
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m build --wheel --outdir dist-a
          python -m build --wheel --outdir dist-b
          wheel_a="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          wheel_b="$(find dist-b -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel_a}"
          test -n "${wheel_b}"
          cmp "${wheel_a}" "${wheel_b}"
          python tools/check_wheel_contents.py "${wheel_a}"
      - name: Validate a generated report
        run: |
          wheel="$(find dist-a -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "${wheel}"
          python -m pip install "${wheel}"
          neurodata-security-audit scan tests/fixtures/clean_bids \
            --json "${RUNNER_TEMP}/audit.json" \
            --html "${RUNNER_TEMP}/audit.html"
          neurodata-security-audit checklist "${RUNNER_TEMP}/audit.json" \
            --tsv "${RUNNER_TEMP}/audit-checklist.tsv"
          neurodata-security-audit compare \
            "${RUNNER_TEMP}/audit.json" "${RUNNER_TEMP}/audit.json" \
            --confirm-same-dataset \
            --json "${RUNNER_TEMP}/comparison.json" \
            --markdown "${RUNNER_TEMP}/comparison.md"
          test -s "${RUNNER_TEMP}/audit.html"
          test -s "${RUNNER_TEMP}/audit-checklist.tsv"
          test -s "${RUNNER_TEMP}/comparison.json"
          test -s "${RUNNER_TEMP}/comparison.md"
          python - "${RUNNER_TEMP}/audit.json" \
            "${RUNNER_TEMP}/comparison.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          import jsonschema

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          schema = json.loads(
              Path("schema/report.schema.json").read_text(encoding="utf-8")
          )
          jsonschema.validate(report, schema)
          comparison = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          comparison_schema = json.loads(
              Path("schema/comparison.schema.json").read_text(encoding="utf-8")
          )
          jsonschema.validate(comparison, comparison_schema)
          PY
