[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodata-release-security-audit"
dynamic = ["version"]
description = "Local pre-release privacy and metadata checks for neurodata"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Daria Agafonova"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
formats = ["mne[hdf5]>=1.12.1", "defusedxml>=0.7.1"]
imaging = ["nibabel>=5.3.2", "pydicom>=3.0.1"]

[project.scripts]
neurodata-security-audit = "neurodata_security_audit.cli:main"
neurodata-usability-build-bundle = "usability.build_participant_bundle:main"
neurodata-usability-score = "usability.score_responses:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["neurodata_security_audit*", "usability*"]
exclude = ["tests*", "tools*"]
namespaces = false

[tool.setuptools.package-data]
usability = [
  "README.md",
  "spec.json",
]

[tool.setuptools.dynamic]
version = {attr = "neurodata_security_audit.__version__"}
