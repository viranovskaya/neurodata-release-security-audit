[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neurodata-release-security-audit"
dynamic = ["version"]
description = "Local pre-release privacy and metadata checks for EEG datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Daria Agafonova"},
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
formats = ["mne[hdf5]>=1.12.1", "defusedxml>=0.7.1"]

[project.scripts]
neurodata-security-audit = "neurodata_security_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "neurodata_security_audit.__version__"}
